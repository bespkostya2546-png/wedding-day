</head>

    <div class="glavnaya">
        <!-- Первый блок, wedding day -->
        <div class="first_block">
            <div class="wedding-card">
                <div class="content">
                    <!-- Блок даты 18 | 07 | 2026 -->
                    <div class="date-block">
                        <div class="date-numbers">
                            <span>18|07|2026</span>
                        </div>
                        <img class="wedding-day" src="image/Wedding_day_4A4A4A.png">
                    </div>
                    <!-- Имена: ДАНИНА ДАРЬЯ -->
                    <div class="names">
                        <img class="nameDanDar" src="image/Names_4A4A4A.png">
                        <!-- <h1>ДАНИИЛ &<br>ДАРЬЯ</h1> -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Второй блок, Дорогие гости -->
        <div class="second_block">
            <div class="dear_guests-card">
                <div class="card_img_hearts">
                    <img class="img_hearts" src="image/hearts.svg">
                </div>
                <div class="card_img_dear">
                    <img class="img_dear_guests" src="image/dear_guests_FFFDF8 (1).png">
                </div>
                <div class="content_text">
                    <span>С радостью и трепетом в сердце приглашаем вас разделить 
                        с нами важный и счастливый день — день нашей свадьбы!</span>
                </div>
                <hr class="content_line">
            </div>
        </div>
        
        <!-- Третий блок, календарь, до свадьбы осталось -->
        <div class="third_block">
            <div class="dear_guests-card">
                <div class="card_img_jule">
                    <img class="img_jule" src="image/Jule (1).png">
                </div>
                <div class="card_img_calendar">
                    <img class="img_calendar" src="image/kalendar_date.png">
                </div>
                <div class="timer_text">
                    <span>До свадьбы осталось...</span>
                </div>
                <div class="timer-container">
                    <div class="timer-item">
                        <svg class="timer-svg" viewBox="0 0 100 100">
                            <circle class="timer-bg" cx="50" cy="50" r="45" />
                            <circle class="timer-progress" id="days-progress" cx="50" cy="50" r="45" />
                        </svg>
                        <span class="timer-value" id="days">00</span>
                        <span class="timer-label">Дней</span>
                    </div>
                    
                    <div class="timer-item">
                        <svg class="timer-svg" viewBox="0 0 100 100">
                            <circle class="timer-bg" cx="50" cy="50" r="45" />
                            <circle class="timer-progress" id="hours-progress" cx="50" cy="50" r="45" />
                        </svg>
                        <span class="timer-value" id="hours">00</span>
                        <span class="timer-label">Часов</span>
                    </div>
                    
                    <div class="timer-item">
                        <svg class="timer-svg" viewBox="0 0 100 100">
                            <circle class="timer-bg" cx="50" cy="50" r="45" />
                            <circle class="timer-progress" id="minutes-progress" cx="50" cy="50" r="45" />
                        </svg>
                        <span class="timer-value" id="minutes">00</span>
                        <span class="timer-label">Минут</span>
                    </div>
                    
                    <div class="timer-item">
                        <svg class="timer-svg" viewBox="0 0 100 100">
                            <circle class="timer-bg" cx="50" cy="50" r="45" />
                            <circle class="timer-progress" id="seconds-progress" cx="50" cy="50" r="45" />
                        </svg>
                        <span class="timer-value" id="seconds">00</span>
                        <span class="timer-label">Секунд</span>
                    </div>
                </div>
                <hr class="content_line">
            </div>
        </div>

        <!-- Четвертый блок, Дорогие гости -->
        <div class="fourd_block">
            <div class="card_four">
                <div class="card_img_hearts_four">
                    <img class="img_hearts_four" src="image/hearts.svg">
                </div>
                <div class="card_img_location_torgestva">
                    <img class="img_location_torgestva" src="image/Mesto_torgestva.png">
                </div>
                <div class="card_img_location">
                    <div class="content_text_card">
                        <div class="content_text_four">
                            <span>Будем ждать вас на нашей свадьбе</span>
                        </div>
                        <div class="content_text_four_2">
                            <span>Ресторан "Lesnik" г. Бугульма ул. Вл. Ленина 152А</span>
                        </div>
                    </div>
                </div>
                <hr class="content_line">
            </div>
        </div> 
    </div>

    <!-- АУДИО ЭЛЕМЕНТ (скрытый) -->
    <audio id="bg-music" loop preload="auto">
        <source src="audio/Icegergert_Zivert.mp3" type="audio/mpeg">
        <source src="audio/Icegergert_Zivert.ogg" type="audio/ogg">
    </audio>
